# Spark standalone: el master coordina, los workers ejecutan los executors
spark.master                       spark://master:7077
spark.hadoop.fs.defaultFS          hdfs://master:9000

# Recursos por executor (default: cada worker ofrece 2 cores / 1536 MB; ver cluster/.env).
# Sin spark.executor.cores, cada executor toma todos los cores de su worker (1 executor por nodo).
spark.executor.memory              1g
spark.driver.memory                1g
spark.sql.shuffle.partitions       8

# Historial de aplicaciones guardado en HDFS
spark.eventLog.enabled             true
spark.eventLog.dir                 hdfs://master:9000/spark-logs
spark.history.fs.logDirectory      hdfs://master:9000/spark-logs
